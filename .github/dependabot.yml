version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    rebase-strategy: "auto"

    labels:
      - "dependencies"
      - "automated"

    assignees:
      - "WalysonMoura"
